    <g fill="none" stroke-width="64" transform="rotate(4.58 256 256)">
      <circle cx="256" cy="256" r="150" stroke="#2dd4bf" stroke-dasharray="211.6 730.9"/>
      <circle cx="256" cy="256" r="150" stroke="#f59e0b" stroke-dasharray="211.6 730.9" transform="rotate(90 256 256)"/>
      <circle cx="256" cy="256" r="150" stroke="#ec4899" stroke-dasharray="211.6 730.9" transform="rotate(180 256 256)"/>
      <circle cx="256" cy="256" r="150" stroke="#8b5cf6" stroke-dasharray="211.6 730.9" transform="rotate(270 256 256)"/>
    </g>
    <circle cx="256" cy="256" r="34" fill="#f5f5f5"/>
